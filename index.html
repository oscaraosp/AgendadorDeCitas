<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crioser Solutions | Gestión Operativa</title>
    
    <link rel="icon" type="image/png" href="Logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #00d1ff;
            --dark: #0f172a;
            --light: #f8fafc;
            --white: #ffffff;
            --success: #22c55e;
            --danger: #ef4444;
            --whatsapp: #25d366;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow: 0 15px 35px rgba(0,0,0,0.05);
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 86, 179, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 209, 255, 0.08) 0px, transparent 50%);
            color: var(--dark);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        header {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px 5%;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.03);
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .container { max-width: 1250px; margin: 0 auto; padding: 40px 20px; }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Estilo para el título colapsable */
        .collapsible-title {
            cursor: pointer;
            user-select: none;
            transition: color 0.3s;
        }
        .collapsible-title:hover { color: var(--primary); }
        .collapsible-title i.chevron { transition: transform 0.3s; font-size: 1.2rem; }
        .collapsible-title.active i.chevron { transform: rotate(180deg); }

        #ordenes-activas, #ordenes-futuras {
            display: grid;
            gap: 25px;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            margin-bottom: 50px;
        }

        /* Ocultar sección futura por defecto */
        #ordenes-futuras { display: none; margin-top: 20px; }

        .orden-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .orden-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 15px;
        }

        .os-id {
            background: rgba(0, 86, 179, 0.1);
            color: var(--primary);
            padding: 6px 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .tag-mantenimiento {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .programado {
            color: var(--danger);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-row { display: flex; gap: 12px; font-size: 0.95rem; line-height: 1.5; }
        .info-row i { color: var(--primary); margin-top: 4px; width: 16px; }

        .acciones {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .btn-confirm { background: var(--dark); color: white; }
        .btn-wa { background: #e8faf0; color: var(--whatsapp); border: 1px solid rgba(37, 211, 102, 0.1); }
        .btn-tecnico { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; grid-column: span 2; }
        .btn-reminder { background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; grid-column: span 2; }
        .btn-edit { background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; }
        .btn-done { background: var(--success); color: white; grid-column: span 2; }
        .btn-delete { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }

        .btn:hover { filter: brightness(0.95); transform: translateY(-2px); }

        .form-section {
            background: var(--white);
            padding: 45px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-top: 60px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }

        input, textarea, select {
            width: 100%;
            padding: 16px;
            border: 2px solid #f1f5f9;
            border-radius: 15px;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
            background: #f8fafc;
        }

        input:focus, select:focus { border-color: var(--primary); background: white; outline: none; }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 100%;
            padding: 20px;
            font-size: 1.1rem;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0, 86, 179, 0.2);
        }

        .tab-section { margin-top: 40px; border-top: 2px solid #e2e8f0; padding-top: 40px; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .acciones { grid-template-columns: 1fr; }
            .btn-confirm, .btn-wa { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>CRIOSER SOLUTIONS</h1>
        <p><i class="fas fa-microchip"></i> Panel de Gestión Operativa</p>
    </header>

    <div class="container">
        <section>
            <h2><i class="fas fa-calendar-day"></i> Servicios del Mes Actual</h2>
            <div id="ordenes-activas"></div>
            <div id="mensaje-vacio" style="display:none; text-align:center; padding:60px; background:white; border-radius:30px; color:#94a3b8;">
                <p>No hay servicios agendados para este mes.</p>
            </div>
        </section>

        <section class="tab-section">
            <h2 class="collapsible-title" onclick="toggleFuturo()">
                <i class="fas fa-history"></i> Programados a Futuro (Mantenimientos) 
                <i class="fas fa-chevron-down chevron" style="margin-left:auto;"></i>
            </h2>
            <div id="ordenes-futuras"></div>
        </section>

        <section class="form-section" id="modulo-registro">
            <h2 id="form-title"><i class="fas fa-plus-circle"></i> Nueva Orden de Servicio</h2>
            <form id="form-servicio">
                <input type="hidden" id="edit-id">
                <div class="form-grid">
                    <div>
                        <label style="font-weight:700; display:block; margin-bottom:10px;">Nombre del Cliente</label>
                        <input type="text" id="cliente" placeholder="Nombre completo" required>
                    </div>
                    <div>
                        <label style="font-weight:700; display:block; margin-bottom:10px;">Número de WhatsApp</label>
                        <input type="text" id="telefono" placeholder="Ej: 57323..." required>
                    </div>
                    <div style="grid-column: span 2;">
                        <label style="font-weight:700; display:block; margin-bottom:10px;">Tipo de Servicio</label>
                        <select id="tipo-servicio" required>
                            <option value="mantenimiento">Mantenimiento Preventivo</option>
                            <option value="otro">Otro Servicio (Reparación/Instalación)</option>
                        </select>
                    </div>
                    <div style="grid-column: span 2;">
                        <label style="font-weight:700; display:block; margin-bottom:10px;">Dirección del Servicio</label>
                        <input type="text" id="direccion" placeholder="Dirección completa y barrio" required>
                    </div>
                    <div style="grid-column: span 2;">
                        <label style="font-weight:700; display:block; margin-bottom:10px;">Detalles del Trabajo</label>
                        <textarea id="servicio" rows="3" placeholder="Describe la falla o el mantenimiento..." required></textarea>
                    </div>
                    <div style="grid-column: span 2;">
                        <label style="font-weight:700; display:block; margin-bottom:10px;">Fecha y Hora Programada</label>
                        <input type="datetime-local" id="fecha" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-submit" id="btn-guardar">
                    <i class="fas fa-save"></i> Guardar Servicio en Agenda
                </button>
            </form>
        </section>
    </div>

    <script>
        const form = document.getElementById('form-servicio');
        const containerActual = document.getElementById('ordenes-activas');
        const containerFuturo = document.getElementById('ordenes-futuras');
        let ordenes = JSON.parse(localStorage.getItem('ordenes')) || [];
        let nextId = localStorage.getItem('nextId') ? parseInt(localStorage.getItem('nextId')) : 1;

        function guardarDatos() {
            localStorage.setItem('ordenes', JSON.stringify(ordenes));
            localStorage.setItem('nextId', nextId);
        }

        // Lógica para detectar si la fecha pertenece al mes actual o ya pasó
        function esMesActualOAnterior(fechaStr) {
            const fecha = new Date(fechaStr);
            const hoy = new Date();
            // Comparamos año y mes. Si es el mismo mes o un mes/año anterior, se muestra en la lista principal.
            return (fecha.getFullYear() < hoy.getFullYear()) || 
                   (fecha.getFullYear() === hoy.getFullYear() && fecha.getMonth() <= hoy.getMonth());
        }

        function toggleFuturo() {
            const div = document.getElementById('ordenes-futuras');
            const title = document.querySelector('.collapsible-title');
            if (div.style.display === 'grid') {
                div.style.display = 'none';
                title.classList.remove('active');
            } else {
                div.style.display = 'grid';
                title.classList.add('active');
            }
        }

        function renderizarOrdenes() {
            containerActual.innerHTML = '';
            containerFuturo.innerHTML = '';
            
            if (ordenes.length === 0) {
                document.getElementById('mensaje-vacio').style.display = 'block';
                return;
            }
            document.getElementById('mensaje-vacio').style.display = 'none';

            ordenes.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

            ordenes.forEach(orden => {
                const esMantenimiento = orden.tipo === 'mantenimiento';
                const card = document.createElement('div');
                card.className = 'orden-card';
                
                const fechaCita = new Date(orden.fecha).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                const mostrarEnActual = esMesActualOAnterior(orden.fecha);

                card.innerHTML = `
                    <div class="card-header">
                        <span class="os-id">OS-${String(orden.id).padStart(4, '0')}</span>
                        ${esMantenimiento ? '<span class="tag-mantenimiento">Mantenimiento</span>' : ''}
                        <span class="programado"><i class="far fa-clock"></i> ${fechaCita}</span>
                    </div>
                    <div class="info-row"><i class="fas fa-user"></i><span><strong>${orden.cliente}</strong></span></div>
                    <div class="info-row"><i class="fas fa-map-marker-alt"></i><span>${orden.direccion}</span></div>
                    <div class="info-row" style="background:#f1f5f9; padding:12px; border-radius:12px;"><span>${orden.servicio}</span></div>
                    
                    <div class="acciones">
                        ${mostrarEnActual ? `
                            <button onclick="enviarConfirmacion(${orden.id})" class="btn btn-confirm"><i class="fas fa-paper-plane"></i> Confirmar</button>
                            <a href="https://wa.me/${orden.telefono.replace(/\D/g,'')}" target="_blank" class="btn btn-wa"><i class="fab fa-whatsapp"></i> Chat</a>
                            <button onclick="enviarAlTecnico(${orden.id})" class="btn btn-tecnico"><i class="fas fa-tools"></i> Enviar al Técnico</button>
                            <button onclick="enviarRecordatorio(${orden.id})" class="btn btn-reminder"><i class="fas fa-bell"></i> Recordatorio</button>
                            <button onclick="cargarEdicion(${orden.id})" class="btn btn-edit"><i class="fas fa-pen"></i> Editar</button>
                            <button onclick="culminarServicio(${orden.id})" class="btn btn-done"><i class="fas fa-check-circle"></i> Finalizar Trabajo</button>
                        ` : `
                            <button onclick="enviarRecordatorio(${orden.id})" class="btn btn-reminder"><i class="fas fa-bell"></i> Recordatorio</button>
                            <button onclick="cargarEdicion(${orden.id})" class="btn btn-edit"><i class="fas fa-pen"></i> Editar</button>
                            <button onclick="eliminarServicio(${orden.id})" class="btn btn-delete"><i class="fas fa-trash"></i> Eliminar</button>
                        `}
                    </div>
                `;

                if (mostrarEnActual) {
                    containerActual.appendChild(card);
                } else {
                    containerFuturo.appendChild(card);
                }
            });

            // Si no hay nada a futuro, avisar dentro del colapsable
            if (containerFuturo.innerHTML === '') {
                containerFuturo.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#94a3b8; padding:20px;">No hay mantenimientos programados para meses posteriores.</p>';
            }
        }

        window.eliminarServicio = function(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este servicio programado? Esta acción no se puede deshacer.")) {
                ordenes = ordenes.filter(o => o.id !== id);
                guardarDatos();
                renderizarOrdenes();
            }
        };

        window.enviarConfirmacion = function(id) {
            const orden = ordenes.find(o => o.id === id);
            const fecha = new Date(orden.fecha).toLocaleString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
            const msg = `¡Hola ${orden.cliente}! Confirmamos su servicio con Crioser Solutions para el ${fecha}. ¿Nos confirma su disponibilidad?`;
            window.open(`https://wa.me/${orden.telefono.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.enviarRecordatorio = function(id) {
            const orden = ordenes.find(o => o.id === id);
            const msg = `Hola ${orden.cliente}, le saludamos de Crioser Solutions. Recordamos que su equipo está próximo a mantenimiento. ¿Desea programar su mantenimiento para esta semana?`;
            window.open(`https://wa.me/${orden.telefono.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.enviarAlTecnico = function(id) {
            const orden = ordenes.find(o => o.id === id);
            const fecha = new Date(orden.fecha).toLocaleString();
            const msg = `*REPORTE DE SERVICIO - CRIOSER*\n\n` +
                        `📍 *Cliente:* ${orden.cliente}\n` +
                        `📞 *Tel:* ${orden.telefono}\n` +
                        `🏠 *Dir:* ${orden.direccion}\n` +
                        `⏰ *Fecha:* ${fecha}\n` +
                        `🛠 *Trabajo:* ${orden.servicio}\n` +
                        `📋 *Tipo:* ${orden.tipo.toUpperCase()}`;
            window.open(`https://wa.me/573239053250?text=${encodeURIComponent(msg)}`, '_blank');
        };

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const datos = {
                cliente: document.getElementById('cliente').value,
                telefono: document.getElementById('telefono').value,
                tipo: document.getElementById('tipo-servicio').value,
                direccion: document.getElementById('direccion').value,
                servicio: document.getElementById('servicio').value,
                fecha: document.getElementById('fecha').value
            };
            if (editId) {
                const index = ordenes.findIndex(o => o.id == editId);
                ordenes[index] = { ...ordenes[index], ...datos };
            } else {
                ordenes.push({ id: nextId++, ...datos });
            }
            guardarDatos();
            renderizarOrdenes();
            form.reset();
            document.getElementById('edit-id').value = "";
            document.getElementById('form-title').innerHTML = `<i class="fas fa-plus-circle"></i> Nueva Orden de Servicio`;
        });

        window.culminarServicio = function(id) {
            const ordenOriginal = ordenes.find(o => o.id === id);
            if (confirm("¿Confirmas que el trabajo ha sido finalizado correctamente?")) {
                if (ordenOriginal.tipo === 'mantenimiento') {
                    const nuevaFecha = new Date(ordenOriginal.fecha);
                    nuevaFecha.setMonth(nuevaFecha.getMonth() + 4);
                    
                    ordenes.push({
                        ...ordenOriginal,
                        id: nextId++,
                        fecha: nuevaFecha.toISOString().slice(0, 16)
                    });
                    alert("Servicio finalizado. Se ha agendado automáticamente para: " + nuevaFecha.toLocaleDateString());
                }
                ordenes = ordenes.filter(o => o.id !== id);
                guardarDatos();
                renderizarOrdenes();
            }
        };

        window.cargarEdicion = function(id) {
            const orden = ordenes.find(o => o.id === id);
            document.getElementById('edit-id').value = orden.id;
            document.getElementById('cliente').value = orden.cliente;
            document.getElementById('telefono').value = orden.telefono;
            document.getElementById('tipo-servicio').value = orden.tipo || 'mantenimiento';
            document.getElementById('direccion').value = orden.direccion;
            document.getElementById('servicio').value = orden.servicio;
            document.getElementById('fecha').value = orden.fecha;
            document.getElementById('form-title').innerHTML = `<i class="fas fa-pen"></i> Editando OS-${id}`;
            document.getElementById('modulo-registro').scrollIntoView({behavior: 'smooth'});
        };

        renderizarOrdenes();
    </script>
</body>
</html>
